apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: mender-ci-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: mender-ci
spec:
  scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mender-gateway
spec:
  gatewayClassName: mender-ci-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: mender-ci
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: mender.example.com
      allowedRoutes:
        namespaces:
          from: Same
