{{- include "gateway_api_validation" . }}
{{- if and .Values.gateway.enabled .Values.featureGates.gatewayApi .Values.gateway.admin_panel.enabled }}
{{- $g := .Values.gateway.admin_panel }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-admin-panel-httproute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mender.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-panel
{{- with $g.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  parentRefs:
    {{- toYaml $g.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.admin_panel.hostname | quote }}
  rules:
    {{- range $g.httpRoute.rules }}
    {{- $rule := deepCopy . }}
    {{- $_ := set $rule "backendRefs" (list (dict "name" (include "mender.serviceName" $) "port" $.Values.api_gateway.service.httpPort)) }}
    {{- toYaml (list $rule) | nindent 4 }}
    {{- end }}
{{- end }}
