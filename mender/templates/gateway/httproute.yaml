{{- include "gateway_api_validation" . }}
{{- if and .Values.gateway.enabled .Values.featureGates.gatewayApi }}
{{- $g := .Values.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-httproute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mender.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- with $g.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  parentRefs:
    {{- toYaml $g.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- range $g.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- if $g.httpRoute.tenantadmHooks }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/hooks/v1/tenantadm
      backendRefs:
        - name: {{ .Values.tenantadm.service.name }}
          port: {{ .Values.tenantadm.service.port }}
    {{- end }}
    {{- range $g.httpRoute.rules }}
    {{- $rule := deepCopy . }}
    {{- $_ := set $rule "backendRefs" (list (dict "name" (include "mender.serviceName" $) "port" $.Values.api_gateway.service.httpPort)) }}
    {{- toYaml (list $rule) | nindent 4 }}
    {{- end }}
{{- end }}
