{{- if and .Values.deviceconnect.enabled .Values.deviceconnect.config }}
{{- /* This (entire) ConfigMap is mounted at /etc/deviceconnect */}}
{{- block "deviceconnect_configmap" (dict "dot" . "migration" false) }}
{{ $name := printf "%s-deviceconnect%s" (include "mender.fullname" .dot) (ternary "-migration" "" .migration) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ print $name | quote }}
  namespace: {{ .dot.Release.Namespace }}
  labels:
    {{- include "mender.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ print $name | quote }}
    app.kubernetes.io/component: deviceconnect
  {{- if .migration }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
data:
  config.yaml: |-
    {{- if (typeIs "string" .dot.Values.deviceconnect.config) }}
    {{- fromYaml .dot.Values.deviceconnect.config | toYaml | nindent 4}}
    {{- else }}
    {{- toYaml .dot.Values.deviceconnect.config | nindent 4 }}
    {{- end }}
{{- end }}
---
{{ template "deviceconnect_configmap" (dict "dot" . "migration" true) }}
{{- end }}
