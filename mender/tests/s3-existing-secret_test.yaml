suite: test global.s3.existingSecret
templates:
  - templates/secrets/secret-artifacts-storage.yaml
  - templates/deployments/deployment.yaml
  - templates/deployments/cronjob.yaml
release:
  namespace: mender
tests:
  - it: renders the artifacts-storage Secret by default
    template: templates/secrets/secret-artifacts-storage.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: artifacts-storage

  - it: renders no storage Secret with global.s3.existingSecret
    template: templates/secrets/secret-artifacts-storage.yaml
    set:
      global.s3.existingSecret: my-s3
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no storage Secret with global.s3.existingSecret and keys set
    template: templates/secrets/secret-artifacts-storage.yaml
    set:
      global.s3.existingSecret: my-s3
      global.s3.AWS_ACCESS_KEY_ID: my-access
      global.s3.AWS_SECRET_ACCESS_KEY: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: deployments reads artifacts-storage by default
    template: templates/deployments/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            prefix: DEPLOYMENTS_
            secretRef:
              name: artifacts-storage

  - it: deployments reads global.s3.existingSecret
    template: templates/deployments/deployment.yaml
    set:
      global.s3.existingSecret: my-s3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            prefix: DEPLOYMENTS_
            secretRef:
              name: my-s3
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            prefix: DEPLOYMENTS_
            secretRef:
              name: artifacts-storage

  - it: the storage cleanup CronJob reads artifacts-storage by default
    template: templates/deployments/cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            prefix: DEPLOYMENTS_
            secretRef:
              name: artifacts-storage

  - it: the storage cleanup CronJob reads global.s3.existingSecret
    template: templates/deployments/cronjob.yaml
    set:
      global.s3.existingSecret: my-s3
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            prefix: DEPLOYMENTS_
            secretRef:
              name: my-s3

  - it: rejects global.s3.existingSecret with RustFS
    template: templates/secrets/secret-artifacts-storage.yaml
    set:
      global.s3.existingSecret: my-s3
      rustfs.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "rustfs.enabled is not supported with global.s3.existingSecret"
