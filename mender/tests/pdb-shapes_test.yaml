suite: test pod disruption budget shapes
templates:
  - templates/inventory/pdb.yaml
tests:
  - it: should render maxUnavailable when minAvailable is an empty string
    set:
      inventory.pdb:
        enabled: true
        minAvailable: ""
        maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should fail when both minAvailable and maxUnavailable are set
    set:
      inventory.pdb:
        enabled: true
        minAvailable: 2
        maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "Only one of minAvailable or maxUnavailable can be set"

  - it: should render minAvailable verbatim even when it exceeds the replica floor
    # the chart cannot see the running replica count, so minAvailable 3 against
    # minReplicas 2 renders a PDB permitting zero disruptions. Values-level mistake.
    set:
      inventory.pdb:
        enabled: true
        minAvailable: 3
      inventory.hpa:
        enabled: true
        minReplicas: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 3
