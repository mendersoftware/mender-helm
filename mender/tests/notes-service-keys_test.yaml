suite: warn when useradm or device-auth keys are generated by the chart
templates:
  - templates/NOTES.txt
tests:
  - it: warns by default, keys are generated
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: GENERATED SERVICE KEYS"
      - matchRegexRaw:
          pattern: "useradm \\(set useradm\\.certs\\.existingSecret\\)"
      - matchRegexRaw:
          pattern: "device_auth \\(set device_auth\\.certs\\.existingSecret\\)"

  - it: warns only for device_auth when useradm uses existingSecret
    set:
      useradm.certs.existingSecret: mender-useradm-keys
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: GENERATED SERVICE KEYS"
      - notMatchRegexRaw:
          pattern: "useradm\\.certs"
      - matchRegexRaw:
          pattern: "device_auth\\.certs"

  - it: no warning when both services use existingSecret
    set:
      useradm.certs.existingSecret: mender-useradm-keys
      device_auth.certs.existingSecret: mender-device-auth-keys
    asserts:
      - notMatchRegexRaw:
          pattern: "GENERATED SERVICE KEYS"

  - it: no warning when both keys are set inline
    set:
      useradm.certs.key: "-----BEGIN PRIVATE KEY-----\nx\n-----END PRIVATE KEY-----"
      device_auth.certs.key: "-----BEGIN PRIVATE KEY-----\nx\n-----END PRIVATE KEY-----"
    asserts:
      - notMatchRegexRaw:
          pattern: "GENERATED SERVICE KEYS"

  - it: no warning for a disabled service
    set:
      useradm.enabled: false
      device_auth.certs.existingSecret: mender-device-auth-keys
    asserts:
      - notMatchRegexRaw:
          pattern: "GENERATED SERVICE KEYS"
