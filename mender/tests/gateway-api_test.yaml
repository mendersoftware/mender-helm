suite: test gateway api feature gate
templates:
  - templates/gateway/httproute.yaml
  - templates/gateway/extra-objects.yaml
  - templates/ingress.yaml
capabilities:
  majorVersion: 1
  minorVersion: 30
  apiVersions:
    - networking.k8s.io/v1
    - gateway.networking.k8s.io/v1
tests:
  - it: renders nothing with defaults
    template: templates/gateway/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when gateway.enabled is set and the gate is off
    template: templates/gateway/httproute.yaml
    set:
      gateway.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.enabled requires featureGates.gatewayApi=true (experimental)"

  - it: renders nothing when only the gate is on
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails without parentRefs
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.parentRefs is required"

  - it: fails on a parentRef without a name
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - sectionName: https
    asserts:
      - failedTemplate:
          errorMessage: "every gateway.httpRoute.parentRefs entry needs a name"

  - it: fails without hostnames
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.hostnames: []
    asserts:
      - failedTemplate:
          errorMessage: "gateway.enabled requires gateway.httpRoute.hostnames"

  - it: fails without rules
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules: []
    asserts:
      - failedTemplate:
          errorMessage: "gateway.enabled requires gateway.httpRoute.rules"

  - it: renders an HTTPRoute attached to the given Gateway
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
          namespace: gateway-system
          sectionName: https
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: mender-httproute
      - equal:
          path: spec.parentRefs[0].name
          value: gw
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: https
      - equal:
          path: spec.hostnames[0]
          value: mender.example.com

  - it: routes to the api-gateway Service by default
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: mender-api-gateway
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80

  - it: follows api_gateway.service.name and httpPort
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      api_gateway.service.name: custom-gateway
      api_gateway.service.httpPort: 8080
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: custom-gateway
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  - it: every rule routes to the api-gateway Service
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - matches:
            - path:
                type: PathPrefix
                value: /healthz
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 3600s
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: mender-api-gateway
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: mender-api-gateway
      - equal:
          path: spec.rules[1].timeouts.request
          value: 3600s

  - it: rejects backendRefs in a rule
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - backendRefs:
            - name: mender-tenantadm
              port: 8080
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].backendRefs is not allowed: every rule routes to the api-gateway Service"

  - it: rejects empty backendRefs too
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - backendRefs: []
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].backendRefs is not allowed: every rule routes to the api-gateway Service"

  - it: renders no tenantadm rule by default
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      global.enterprise: true
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 1

  - it: tenantadmHooks routes the tenantadm webhooks to the tenantadm Service, first
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      global.enterprise: true
      gateway.httpRoute.tenantadmHooks: true
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[0].matches
          value:
            - path:
                type: PathPrefix
                value: /api/hooks/v1/tenantadm
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: mender-tenantadm
              port: 8080
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: mender-api-gateway

  - it: tenantadmHooks follows tenantadm.service.name and port
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      global.enterprise: true
      gateway.httpRoute.tenantadmHooks: true
      tenantadm.service.name: custom-tenantadm
      tenantadm.service.port: 9090
    asserts:
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: custom-tenantadm
              port: 9090

  - it: tenantadmHooks fails without enterprise
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.tenantadmHooks: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.tenantadmHooks requires global.enterprise and tenantadm.enabled"

  - it: tenantadmHooks fails when tenantadm is disabled
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      global.enterprise: true
      tenantadm.enabled: false
      gateway.httpRoute.tenantadmHooks: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.tenantadmHooks requires global.enterprise and tenantadm.enabled"

  - it: rejects a URLRewrite that sets a hostname
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - filters:
            - type: URLRewrite
              urlRewrite:
                hostname: admin.example.com
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].filters[0]: URLRewrite must not set hostname"

  - it: rejects the RequestHeaderModifier filter
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - filters:
            - type: RequestHeaderModifier
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].filters[0]: type RequestHeaderModifier is not allowed, only RequestRedirect and URLRewrite"

  - it: rejects the ResponseHeaderModifier filter
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - filters:
            - type: ResponseHeaderModifier
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].filters[0]: type ResponseHeaderModifier is not allowed, only RequestRedirect and URLRewrite"

  - it: rejects the RequestMirror filter
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - filters:
            - type: RequestMirror
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].filters[0]: type RequestMirror is not allowed, only RequestRedirect and URLRewrite"

  - it: rejects the ExtensionRef filter
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - filters:
            - type: ExtensionRef
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0].filters[0]: type ExtensionRef is not allowed, only RequestRedirect and URLRewrite"

  - it: rejects a rule that is not a map
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - not-a-map
    asserts:
      - failedTemplate:
          errorMessage: "gateway.httpRoute.rules[0] must be a map"

  - it: allows RequestRedirect and a URLRewrite of the path
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
        - filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /ui/
    asserts:
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestRedirect
      - equal:
          path: spec.rules[1].filters[0].urlRewrite.path.replaceFullPath
          value: /ui/

  - it: passes annotations through
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.annotations:
        example.com/key: value
    asserts:
      - equal:
          path: metadata.annotations["example.com/key"]
          value: value

  - it: omits annotations when empty
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
    asserts:
      - notExists:
          path: metadata.annotations

  - it: renders one host entry per hostname
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.httpRoute.hostnames:
        - a.example.com
        - b.example.com
    asserts:
      - equal:
          path: spec.hostnames
          value:
            - a.example.com
            - b.example.com

  - it: leaves the Ingress alone when the gate is on
    template: templates/ingress.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: mender-api-gateway

  - it: renders no Ingress when only the gate is on
    template: templates/ingress.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no extra objects by default
    template: templates/gateway/extra-objects.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders extraObjects in the release namespace
    template: templates/gateway/extra-objects.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: TargetGroupConfiguration
          metadata:
            name: mender-api-gateway
          spec:
            targetReference:
              name: mender-api-gateway
            defaultConfiguration:
              targetType: ip
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: TargetGroupConfiguration
      - equal:
          path: apiVersion
          value: gateway.k8s.aws/v1
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.targetReference.name
          value: mender-api-gateway
      - equal:
          path: spec.defaultConfiguration.targetType
          value: ip

  - it: renders every extra object and accepts the release namespace
    template: templates/gateway/extra-objects.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: TargetGroupConfiguration
          metadata:
            name: one
            namespace: NAMESPACE
        - apiVersion: alb.networking.azure.io/v1
          kind: HealthCheckPolicy
          metadata:
            name: two
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: kind
          value: TargetGroupConfiguration
        documentSelector:
          path: metadata.name
          value: one
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: one
      - equal:
          path: kind
          value: HealthCheckPolicy
        documentSelector:
          path: metadata.name
          value: two
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: two

  - it: fails when extraObjects is set without gateway.enabled
    template: templates/gateway/httproute.yaml
    set:
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: TargetGroupConfiguration
          metadata:
            name: one
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects requires gateway.enabled"

  - it: fails on an extra object without apiVersion, kind or name
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - kind: TargetGroupConfiguration
          metadata:
            name: one
    asserts:
      - failedTemplate:
          errorMessage: "every gateway.extraObjects entry needs apiVersion, kind and metadata.name"

  - it: fails on an extra object without metadata
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: TargetGroupConfiguration
    asserts:
      - failedTemplate:
          errorMessage: "every gateway.extraObjects entry needs apiVersion, kind and metadata.name"

  - it: rejects an object in another namespace
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: TargetGroupConfiguration
          metadata:
            name: one
            namespace: kube-system
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects entries must be in the release namespace (NAMESPACE), got kube-system"

  - it: rejects a Gateway
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got gateway.networking.k8s.io/v1 Gateway"

  - it: rejects a GatewayClass
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got gateway.networking.k8s.io/v1 GatewayClass"

  - it: rejects a ReferenceGrant
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.networking.k8s.io/v1beta1
          kind: ReferenceGrant
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got gateway.networking.k8s.io/v1beta1 ReferenceGrant"

  - it: rejects an HTTPRoute, it would bypass the route checks
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got gateway.networking.k8s.io/v1 HTTPRoute"

  - it: rejects a ListenerSet and the experimental group
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.networking.x-k8s.io/v1alpha1
          kind: XListenerSet
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got gateway.networking.x-k8s.io/v1alpha1 XListenerSet"

  - it: rejects built-in Kubernetes resources
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got v1 Secret"

  - it: rejects RBAC objects
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got rbac.authorization.k8s.io/v1 ClusterRoleBinding"

  - it: rejects workloads
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got apps/v1 Deployment"

  - it: rejects admission webhooks
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingWebhookConfiguration
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got admissionregistration.k8s.io/v1 ValidatingWebhookConfiguration"

  - it: rejects other built-in groups such as networking.k8s.io
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got networking.k8s.io/v1 NetworkPolicy"

  - it: rejects GitOps and policy objects
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got argoproj.io/v1alpha1 Application"

  - it: rejects another kind of an accepted group
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: LoadBalancerConfiguration
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got gateway.k8s.aws/v1 LoadBalancerConfiguration"

  - it: rejects another kind of the Azure group
    template: templates/gateway/httproute.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: alb.networking.azure.io/v1
          kind: ApplicationLoadBalancer
          metadata:
            name: x
    asserts:
      - failedTemplate:
          errorMessage: "gateway.extraObjects only accepts gateway.k8s.aws/TargetGroupConfiguration and alb.networking.azure.io/HealthCheckPolicy, got alb.networking.azure.io/v1 ApplicationLoadBalancer"

  - it: accepts the AWS TargetGroupConfiguration and the Azure HealthCheckPolicy
    template: templates/gateway/extra-objects.yaml
    set:
      featureGates.gatewayApi: true
      gateway.enabled: true
      gateway.httpRoute.parentRefs:
        - name: gw
      gateway.extraObjects:
        - apiVersion: gateway.k8s.aws/v1
          kind: TargetGroupConfiguration
          metadata:
            name: aws
        - apiVersion: alb.networking.azure.io/v1
          kind: HealthCheckPolicy
          metadata:
            name: azure
    asserts:
      - hasDocuments:
          count: 2
