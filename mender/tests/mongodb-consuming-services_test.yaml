suite: test MongoDB connection injection - all consuming services
tests:
  - it: workflows uses mongodb-common secret when mongodb.enabled (default)
    template: templates/workflows/deployment-server.yaml
    set:
      workflows.enabled: true
      mongodb.enabled: true
      global.mongodb.URL: ""
      global.mongodb.existingSecret: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            prefix: WORKFLOWS_
            secretRef:
              name: mongodb-common

  - it: workflows uses global.mongodb.existingSecret when mongodb is disabled
    template: templates/workflows/deployment-server.yaml
    set:
      workflows.enabled: true
      mongodb.enabled: false
      global.mongodb.existingSecret: "my-mongodb-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            prefix: WORKFLOWS_
            secretRef:
              name: my-mongodb-secret

  - it: workflows still points at mongodb-common when only global.mongodb.URL is set
    template: templates/workflows/deployment-server.yaml
    set:
      workflows.enabled: true
      mongodb.enabled: false
      global.mongodb.URL: "mongodb://external-mongo:27017"
      global.mongodb.existingSecret: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            prefix: WORKFLOWS_
            secretRef:
              name: mongodb-common

