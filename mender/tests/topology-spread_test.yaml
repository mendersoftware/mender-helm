suite: test topologySpreadConstraints
templates:
  - templates/inventory/deployment.yaml
  - templates/api-gateway/deployment.yaml
  - templates/api-gateway/configmap.yaml
tests:
  - it: should not render topologySpreadConstraints when unset on the coalesce path
    template: templates/inventory/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should not render topologySpreadConstraints when unset on the merge path
    template: templates/api-gateway/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should treat an empty list as unset
    template: templates/inventory/deployment.yaml
    set:
      default.topologySpreadConstraints: []
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should render the default list on a coalesce-path service
    template: templates/inventory/deployment.yaml
    set:
      default.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: inventory
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule

  - it: should let a coalesce-path service replace the default list entirely
    template: templates/inventory/deployment.yaml
    set:
      default.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      inventory.topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 2

  - it: should let a merge-path service replace the default list entirely
    template: templates/api-gateway/deployment.yaml
    set:
      default.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      api_gateway.topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: should pass matchLabelKeys and policies through unmodified
    template: templates/inventory/deployment.yaml
    set:
      default.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: inventory
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].matchLabelKeys[0]
          value: pod-template-hash
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].nodeAffinityPolicy
          value: Honor
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].nodeTaintsPolicy
          value: Honor

  - it: should fail when both podAntiAffinity and spread constraints are set
    template: templates/inventory/deployment.yaml
    set:
      inventory.affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: inventory
      inventory.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - failedTemplate:
          errorMessage: "inventory: cannot set both podAntiAffinity and topologySpreadConstraints: podAntiAffinity would make the topologySpreadConstraints inert."

  - it: should allow nodeAffinity alongside spread constraints
    template: templates/inventory/deployment.yaml
    set:
      inventory.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/nodegroup
                    operator: In
                    values: [mender]
      inventory.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - exists:
          path: spec.template.spec.affinity.nodeAffinity
      - exists:
          path: spec.template.spec.topologySpreadConstraints
