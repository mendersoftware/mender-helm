          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: rsa-device-auth
            namespace: mender
          data:
            private.pem: c3RvcmVkLWVkMjU1MTkta2V5LWZpeHR1cmUKbGluZS10d28K
    asserts:
      - equal:
          path: data["private.pem"]
          value: c3RvcmVkLWVkMjU1MTkta2V5LWZpeHR1cmUKbGluZS10d28K

  - it: device-auth keeps a stored legacy RSA key
    template: templates/device-auth/secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
