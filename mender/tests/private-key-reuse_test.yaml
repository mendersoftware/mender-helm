            namespace: mender
          data:
            private.pem: c3RvcmVkLWVkMjU1MTkta2V5LWZpeHR1cmUKbGluZS10d28K
            other: b3RoZXI=
    asserts:
      - equal:
          path: data["private.pem"]
          value: c3RvcmVkLWVkMjU1MTkta2V5LWZpeHR1cmUKbGluZS10d28K

  - it: device-auth ignores a Secret with the same name in another namespace
    template: templates/device-auth/secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: rsa-device-auth
            namespace: other
          data:
            private.pem: c3RvcmVkLWVkMjU1MTkta2V5LWZpeHR1cmUKbGluZS10d28K
    asserts:
      - matchRegex:
          path: data["private.pem"]
          pattern: ^LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t
      - notEqual:
          path: data["private.pem"]
          value: c3RvcmVkLWVkMjU1MTkta2V5LWZpeHR1cmUKbGluZS10d28K

